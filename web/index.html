<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E.V</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main id="app">
    <header>
      <h1>E.V</h1>
      <p class="tagline">Ask me anything.</p>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask E.V anything…" autocomplete="off" autofocus />
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
